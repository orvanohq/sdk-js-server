# Spec 0008 KIT-1: an SDK repo's CI, built from the core repo's reusable workflows.
# export-template.mjs fills in the language and pins a full commit SHA of orvanohq/orvano main (spec 0010 TPL-3).
# Move the pin forward with the core, and keep the date comment current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    uses: orvanohq/orvano/.github/workflows/repo-hygiene.yml@cb12f1df33e00f892de7040a05e3ab17cf9410d4 # main as of 2026-10-18
    permissions:
      contents: read
      pull-requests: read # the dco job reads the PR's commits (spec 0010 DCO-1)

  sdk:
    uses: orvanohq/orvano/.github/workflows/sdk-typescript.yml@cb12f1df33e00f892de7040a05e3ab17cf9410d4 # main as of 2026-10-18
    permissions:
      contents: read

  # Spec 0014 RGN-3, spec 0005 CGN-3: regenerate from the pinned orvano commit and fail on any difference.
  drift:
    name: drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache the orvano checkout (RGN-2)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .orvano
          key: orvano-${{ hashFiles('orvano-contract.json') }}
      - name: Regenerate from the pin (checks the contract hash too)
        run: pnpm regenerate
      - name: Generated code matches the pin
        run: git diff --exit-code

  # Spec 0014 CNF-5, CNF-6, spec 0005 SQA-3: every scenario in Node and in workerd (Miniflare), against
  # Orvano and the stub from api/conformance/compose.yaml at the pinned commit. The server image is built from that
  # commit here, because nothing publishes ghcr.io/orvanohq/orvano:sha-<commit> yet; switch to pulling it then.
  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache the orvano checkout (RGN-2)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .orvano
          key: orvano-${{ hashFiles('orvano-contract.json') }}
      - name: Fetch the pinned orvano commit
        run: pnpm regenerate
      - name: Build the Orvano image at the pinned commit
        run: docker build --file .orvano/deploy/Dockerfile --tag orvano:pinned .orvano
      - name: Start Orvano, PostgreSQL, and the stub
        env:
          ORVANO_IMAGE: orvano
          ORVANO_IMAGE_TAG: pinned
        run: docker compose --file .orvano/api/conformance/compose.yaml up --detach --wait
      - name: Conformance (Node, workerd)
        run: pnpm conformance
      - name: Server logs
        if: failure()
        env:
          ORVANO_IMAGE: orvano
          ORVANO_IMAGE_TAG: pinned
        run: docker compose --file .orvano/api/conformance/compose.yaml logs --no-color

  ci-gate:
    name: ci-gate
    if: always()
    needs: [hygiene, sdk, drift, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")'

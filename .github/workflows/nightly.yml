# Spec 0014 CNF-5, CNF-6, spec 0005 SQA-3: every night, every server scenario in the runtimes ci.yml doesn't run: Deno,
# Bun, and the other Node lines. Browsers are not on the list, since @orvano/server refuses to load in one (KEY-1).
# It uses the servers ci.yml does: api/conformance/compose.yaml and the published image of the pinned orvano commit.
name: Nightly

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
  # A change to this workflow or to what only it runs proves itself before the next night does.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - packages/server/conformance/hosted.ts
      - packages/server/conformance/serve.ts
      - packages/server/conformance/spawned.test.ts
      - packages/server/vitest.config.ts

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: conformance (${{ matrix.runtime }} ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Exact versions, each the newest at least 3 days old (spec 0008 TL-8). Dependabot doesn't see these, so move
        # them by hand. The Node lines are the two beside .node-version (spec 0005 SQA-1).
        include:
          - runtime: deno
            version: 2.9.8
          - runtime: bun
            version: 1.4.4
          - runtime: node
            version: 22.23.4
          - runtime: node
            version: 26.12.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache the orvano checkout (RGN-2)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .orvano
          key: orvano-${{ hashFiles('orvano-contract.json') }}
      - name: Fetch the pinned orvano commit
        run: pnpm regenerate
      - name: Start Orvano, PostgreSQL, and the stub
        run: |
          ORVANO_IMAGE_TAG="sha-$(jq -r .commit orvano-contract.json)"
          export ORVANO_IMAGE_TAG
          echo "ORVANO_IMAGE_TAG=$ORVANO_IMAGE_TAG" >> "$GITHUB_ENV"
          docker compose --file .orvano/api/conformance/compose.yaml up --detach --wait
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.version }}
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
      # Vitest directly, not through pnpm: the repo's engines hold pnpm to Node 24, and the Node lines test another.
      - name: Conformance
        working-directory: packages/server
        env:
          PROJECT: conformance-${{ matrix.runtime }}
        run: |
          node --version
          node ../../node_modules/vitest/vitest.mjs run --project "$PROJECT"
      - name: Server logs
        if: failure()
        run: docker compose --file .orvano/api/conformance/compose.yaml logs --no-color

  # Spec 0004 DQA-4 sets the rule for a nightly: a failure opens an issue. GitHub's own mail about a failed schedule goes
  # only to whoever last edited the cron. Later failures comment on the open issue, so a long break stays one issue.
  report:
    name: report
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly conformance failed
        run: |
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "It failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label bug --assignee Atteprojects \
              --body "The nightly conformance run failed: $RUN_URL"
          fi

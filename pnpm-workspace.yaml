# Spec 0005 SDK-2, spec 0003 SEC-5: install scripts stay blocked (pnpm's default); allow one only by name here, with a
# reason. A just published version waits 3 days before it can be installed.
packages:
  - packages/*

minimumReleaseAge: 4320

allowBuilds:
  # Denied: esbuild (the conformance worker bundle, size-limit, tsdown, and Vitest) gets its binary from a platform package; its install
  # script only checks that binary.
  esbuild: false
  # Denied: workerd (through miniflare, the conformance runtime) also gets its binary from a platform package; its
  # install script only checks that binary.
  workerd: false

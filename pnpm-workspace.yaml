# Spec 0005 SDK-2, spec 0003 SEC-5: install scripts stay blocked (pnpm's default); allow one only by name here, with a
# reason. A just published version waits 3 days before it can be installed.
packages:
  - packages/*

minimumReleaseAge: 4320

# pnpm audit (spec 0006 SUP-5) ignores an advisory only here, with the reason and when to remove it.
auditConfig:
  ignoreGhsas:
    # minimatch: denial of service through glob part amplification. Reached only through dev tools (ESLint and others
    # that glob the repo's own files; `pnpm audit --prod` is clean, and nothing ships in the package). The advisory,
    # published 2026-10-30, patches only 11.0.1, and ESLint's tree needs the older lines, so no override fits
    # (2026-10-30). Remove when those packages take a patched minimatch. Expires 2026-11-29 (spec 0006 SUP-5: at most
    # 30 days); check again then and renew or remove.
    - GHSA-g3hv-75wg-m249

allowBuilds:
  # Denied: esbuild (the conformance worker bundle, size-limit, tsdown, and Vitest) gets its binary from a platform package; its install
  # script only checks that binary.
  esbuild: false
  # Denied: workerd (through miniflare, the conformance runtime) also gets its binary from a platform package; its
  # install script only checks that binary.
  workerd: false

# Spec 0006 SUP-5: miniflare 4.20260730.0, its newest release, pins undici and sharp versions with high advisories
# (undici GHSA cache, WebSocket, and TLS fixes in 7.29.1; sharp's libheif and librsvg fixes in 0.35.5). Remove these
# once a miniflare release depends on fixed versions.
overrides:
  miniflare>undici: 7.30.1
  miniflare>sharp: 0.35.5
